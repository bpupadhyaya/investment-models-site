name: Sync company directory

# Companies register/delist with SEC essentially every business day, so this runs daily --
# fast/cheap enough for a marketing site (no one needs intraday freshness on whether this
# morning's IPO is listed yet), but far more responsive than a weekly or monthly cadence would
# be. See scripts/sync_company_directory.py's docstring for the full reasoning.
on:
  schedule:
    - cron: "0 8 * * *" # daily, 08:00 UTC (an hour after the private repo's own sync)
  workflow_dispatch: {} # manual "Run workflow" button

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run company directory sync
        run: python3 scripts/sync_company_directory.py

      - name: Commit changes if any
        run: |
          git config user.name "investment-models-site-bot"
          git config user.email "actions@github.com"
          git add data/companies.json
          if git diff --cached --quiet; then
            echo "No changes -- no new/changed companies since last run."
          else
            git commit -m "Auto-sync company directory from SEC EDGAR"
            git push
          fi
